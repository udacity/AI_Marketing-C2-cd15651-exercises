<!doctype html>
<!-- Vessl launch creative - 16:9 display banner. Same concept and copy as the 1:1,
     re-laid out for the frame: type across the left half, subject pushed to the
     right third, CTA bottom-left. See variant-16x9.png for the render. -->
<html lang="en">
<meta charset="utf-8">
<title>Vessl - 16:9 banner</title>
<style>
  :root {
    --aqua-soft: #D8F0F1;
    --blue-soft: #DCEBF6;
    --ink: #17383F;
    --ink-soft: #3D6672;
    --coral: #FF7A5C;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #E9EEF0; }
  .frame {
    position: relative; width: 1920px; height: 1080px; overflow: hidden;
    background:
      radial-gradient(80% 110% at 74% 6%, rgba(255,255,255,.95) 0%, rgba(255,255,255,0) 58%),
      linear-gradient(120deg, var(--aqua-soft) 0%, var(--blue-soft) 46%, var(--white) 100%);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--ink);
  }
  .copy { position: absolute; top: 236px; left: 128px; width: 880px; }
  .headline {
    margin: 0; font-size: 92px; line-height: 1.06; letter-spacing: -.028em; font-weight: 600;
  }
  .tagline {
    margin: 44px 0 0; font-size: 46px; font-weight: 500; color: var(--ink-soft); letter-spacing: -.01em;
  }
  .cta {
    position: absolute; left: 128px; bottom: 132px;
    padding: 30px 56px; border-radius: 999px;
    background: var(--coral); color: var(--white);
    font-size: 34px; font-weight: 600;
    box-shadow: 0 16px 38px rgba(255,122,92,.32);
  }
  /* subject in the right third, bottle sharp and clear of the type column */
  .subject { position: absolute; right: 232px; bottom: 0; width: 400px; }
  .drop { position: absolute; border-radius: 50%; background: var(--white); opacity: .5; }
</style>
<div class="frame">
  <div class="copy">
    <h1 class="headline">It keeps score, so you don't have to.</h1>
    <p class="tagline">Hydration, handled.</p>
  </div>

  <svg class="subject" viewBox="0 0 380 720" aria-label="Vessl bottle">
    <defs>
      <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"  stop-color="#BFE3EA"/>
        <stop offset="34%" stop-color="#F2FAFB"/>
        <stop offset="72%" stop-color="#CFE6EE"/>
        <stop offset="100%" stop-color="#9CC4D2"/>
      </linearGradient>
      <linearGradient id="led" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#7FD4D8" stop-opacity=".35"/>
        <stop offset="45%"  stop-color="#5FC8CE"/>
        <stop offset="100%" stop-color="#7FD4D8" stop-opacity=".35"/>
      </linearGradient>
      <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#4E808F"/>
        <stop offset="55%" stop-color="#6FA0AE"/>
        <stop offset="100%" stop-color="#3F6B78"/>
      </linearGradient>
    </defs>
    <ellipse cx="190" cy="694" rx="150" ry="24" fill="#7FA8B5" opacity=".22"/>
    <rect x="132" y="16" width="116" height="74" rx="26" fill="url(#cap)"/>
    <rect x="146" y="78" width="88"  height="26" rx="11" fill="#37606C"/>
    <rect x="74"  y="100" width="232" height="596" rx="74" fill="url(#body)"/>
    <rect x="74"  y="236" width="232" height="22" fill="url(#led)"/>
    <rect x="104" y="140" width="26"  height="520" rx="13" fill="#fff" opacity=".42"/>
    <rect x="262" y="300" width="12"  height="300" rx="6" fill="#fff" opacity=".22"/>
  </svg>

  <div class="cta">See how it works</div>

  <div class="drop" style="width:16px;height:16px;right:664px;bottom:392px"></div>
  <div class="drop" style="width:10px;height:10px;right:640px;bottom:318px"></div>
  <div class="drop" style="width:20px;height:20px;right:172px;bottom:470px"></div>
</div>
</html>
