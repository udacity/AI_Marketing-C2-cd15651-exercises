<!doctype html>
<!-- Vessl launch creative - 1:1 FIRST PASS (rejected). Kept deliberately so the
     iteration note has a real before/after. What is wrong with it: the subject is
     dead-centre so the headline has to sit on top of it, the warm accent is used
     as a full background wash instead of a single accent, margins are tight so
     nothing breathes, and the tagline is crushed into the bottom edge. The brand
     guide asks for a clean white base, cool aquas, and ONE warm accent; this
     reads high-contrast and hype-y, closer to a gym ad. Compare variant-1x1.html. -->
<html lang="en">
<meta charset="utf-8">
<title>Vessl - 1:1 first pass (rejected)</title>
<style>
  :root {
    --coral: #FF6A44;
    --coral-deep: #E8481F;
    --ink: #17383F;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #E9EEF0; }
  .frame {
    position: relative; width: 1080px; height: 1080px; overflow: hidden;
    /* off-brand: the accent has become the whole palette */
    background: linear-gradient(150deg, var(--coral) 0%, var(--coral-deep) 58%, #2C8FA0 100%);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--white);
  }
  /* subject dead-centre, so the type has nowhere to go but on top of it */
  .subject {
    position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); width: 400px;
  }
  .copy { position: absolute; top: 32px; left: 32px; right: 32px; text-align: center; }
  .headline {
    margin: 0; font-size: 104px; line-height: .98; letter-spacing: -.03em; font-weight: 800;
    text-transform: uppercase; text-shadow: 0 4px 18px rgba(0,0,0,.28);
  }
  .tagline {
    position: absolute; left: 32px; right: 32px; bottom: 18px;
    margin: 0; text-align: center; font-size: 26px; font-weight: 500; opacity: .85;
  }
  .cta {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 300px;
    padding: 20px 40px; border-radius: 4px;
    background: #1B2E33; color: var(--white); font-size: 28px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .04em;
  }
</style>
<div class="frame">
  <svg class="subject" viewBox="0 0 380 720" aria-label="Vessl bottle">
    <defs>
      <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"  stop-color="#BFE3EA"/>
        <stop offset="34%" stop-color="#F2FAFB"/>
        <stop offset="72%" stop-color="#CFE6EE"/>
        <stop offset="100%" stop-color="#9CC4D2"/>
      </linearGradient>
      <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#4E808F"/>
        <stop offset="55%" stop-color="#6FA0AE"/>
        <stop offset="100%" stop-color="#3F6B78"/>
      </linearGradient>
    </defs>
    <rect x="132" y="16" width="116" height="74" rx="26" fill="url(#cap)"/>
    <rect x="146" y="78" width="88"  height="26" rx="11" fill="#37606C"/>
    <rect x="74"  y="100" width="232" height="596" rx="74" fill="url(#body)"/>
    <rect x="104" y="140" width="26"  height="520" rx="13" fill="#fff" opacity=".42"/>
  </svg>

  <div class="copy">
    <h1 class="headline">It keeps score so you don't have to</h1>
  </div>

  <div class="cta">See how it works</div>
  <p class="tagline">Hydration, handled.</p>
</div>
</html>
